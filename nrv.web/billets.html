        <main id="app">
            <section class="content-main">
                <p id="error">Erreur de chargement.</p>
            </section>
        </main>

        <script id="billet-template" type="text/x-handlebars-template">
            <section class="content-main">
                <article class="billet">
                    <p class="medium-title">NRV.net - Nancy Rock Vibration</p>
                    <h1>{{nomSoiree}}</h1>
                    <p>Le {{dateSoiree}} à {{heureDebut}}</p>
                    <p>{{lieu}}</p>

                    <div class="billet-infos">
                        <p><strong>Acheteur :</strong> {{nomAcheteur}}</p>
                        <p><strong>Référence :</strong> {{reference}}</p>
                        <p><strong>Tarif :</strong> {{categorieTarif}}</p>
                        <p><strong>Prix payé :</strong> {{prixPaye}} €</p>
                    </div>
                </article>

                <button type="button" id="print-btn" class="no-print">Imprimer le billet <i class="fa-solid fa-print"></i></button>
            </section>
        </script>
    </body>
</html>
