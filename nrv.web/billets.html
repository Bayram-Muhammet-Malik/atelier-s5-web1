<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NRV.net</title>
        <link rel="preload" href="css/fa7.css" as="style">
        <link rel="stylesheet" href="css/fa7.css">
        <link rel="stylesheet" href="css/style.css" />
        <script src="dist/billets.js" defer></script>
    </head>
    <body>
        <header class="menu">
            <div class="menu-title">
                <h1 class="big-title">NRV.net</h1>
                <p class="medium-title">NANCY ROCK VIBRATION</p>
            </div>
            <div class="menu-link">
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path class="line1" d="M0 40h62c13 0 6 28-4 18L35 35" />
                        <path class="line2" d="M0 50h70" />
                        <path class="line3" d="M0 60h62c13 0 6-28-4-18L35 65" />
                    </svg>
                </label>
                <div class="menu-content">
                    <a href="index.html"><h1>Accueil</h1></a>
                    <a href="spectacles.html"><h1>Programme</h1></a>
                    <a href="pass.html"><h1>Pass 3 jours</h1></a>
                    <a href="panier.html"><h1>Mon panier <i class="fa-solid fa-bag-shopping"></i></h1></a>
                    <a href="login.html" id="login-btn"><h1>Connexion</h1></a>
                </div>
            </div>
        </header>
        <main id="app">
            <section class="content-main">
                <p id="error">Erreur de chargement.</p>
            </section>
        </main>

        <script id="billet-template" type="text/x-handlebars-template">
            <section class="content-main billet">
                <button type="button" id="print-btn" class="no-print">Imprimer le billet <i class="fa-solid fa-print"></i></button>
                <h1>NANCY ROCK VIBRATION</h1>
                {{#if estPass}}
                <span>PASS 3J / 1 ENTRÉE</span>
                {{else}}
                <span>BILLET SOIRÉE / 1 ENTRÉE</span>
                {{/if}}
                <span>{{categorieTarif}} · {{prixPaye}} €</span>

                {{#each soirees}}
                <div class="section">
                    <h1>{{soiree.nom}}</h1>
                    <div class="info-grid">
                        <div>
                            <p>DATE ET HORAIRE</p>
                            <h2>{{soiree.date}}</h2>
                            <p>Début : {{soiree.horaire}}</p>
                        </div>
                        <div>
                            <p>LIEU</p>
                            <h2>{{soiree.lieu}}</h2>
                        </div>
                    </div>
                </div>
                {{/each}}

                <div>
                    <div>
                        <p>ACHETEUR · PAS LE PORTEUR DU BILLET</p>
                        <h2>{{nomAcheteur}}</h2>
                        <p>RÉFÉRENCE UNIQUE DU BILLET</p>
                        <h2>{{reference}}</h2>
                        <p><strong>Billet non nominatif</strong></p>
                        <p>Valable pour une seule entrée. Le nom de l'acheteur n'impose pas l'identité du porteur. Ne partagez ce billet qu'avec son utilisateur.</p>
                    </div>
                </div>
                <p>Présentez ce billet lisible, sur téléphone ou imprimé. Achat exclusivement en ligne. Données de démonstration · Paiement simulé, aucun débit réel.</p>
            </section>
        </script>

        <script id="mybillets-template" type="text/x-handlebars-template">
    <section class="content-main mybillets">
        <h1>Mes billets</h1>
        {{#each billets}}
        <div class="billet-container">
            <div class="billet-header-row">
                <div>
                    <h2>Billet {{reference}}</h2>
                    <p>
                        {{#if estPass}}
                        <span>PASS 3J / 1 ENTRÉE</span>
                        {{else}}
                        <span>BILLET SOIRÉE / 1 ENTRÉE</span>
                        {{/if}}
                        - {{prixPaye}} € (Tarif {{categorieTarif}})
                    </p>
                </div>
                <div>
                    <a href="?token={{token}}" class="btn">Voir le billet <i class="fa-solid fa-arrow-up-right"></i></a>
                </div>
            </div>
            <div class="soirees-list">
                {{#each soirees}}
                <div class="billet-soire-info">
                    <div>
                        <p>Le {{date}} à {{horaire}}</p>
                        <h2>{{nom}} / {{thematique}}</h2>
                        <p>{{lieu}}</p>
                    </div>
                    <div>
                        <a href="soirees.html?id={{id}}" class="pbtn">Voir la soirée <i class="fa-solid fa-arrow-up-right"></i></a>
                    </div>
                </div>
                {{/each}}
            </div>
        </div>
        {{else}}
        <p>Vous n'avez aucun billet pour le moment.</p>
        {{/each}}
    </section>
</script>
    </body>
</html>
